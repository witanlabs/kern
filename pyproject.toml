[project]
name = "kern"
version = "0.1.0"
description = "Persistent Python kernel execution from the shell"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyter-client>=8.8.0",
]

[project.scripts]
kern = "kern.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
